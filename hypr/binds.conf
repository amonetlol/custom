# custom — keybinds
# source = ~/.config/hypr/binds.conf

source = ~/.config/custom/current

$dir = ~/.config/custom/$THEME
$rofi_dir = $dir/rofi

$hub = $rofi_dir/hub.sh
$hub_gui = $rofi_dir/hub-gui.sh
$foot_cfg = $dir/foot/foot.ini
$foot = foot -c $foot_cfg
$foot_float = foot -c $foot_cfg --app-id foot-float

$file = thunar
$browser = firefox
$shot = ~/.config/custom/scripts/shot.sh
$rofi_theme = ~/.config/custom/scripts/rofi-theme.sh
$config = ~/.config/custom/scripts/configuration.sh

$mainMod = SUPER

###################
### CUSTOM HUB  ###
###################

bind = $mainMod, D, exec, $hub --menu
bind = $mainMod, F2, exec, $hub_gui
bind = $mainMod, F11, exec, $hub_gui
bind = $mainMod, F12, exec, $hub --waybar
bind = $mainMod, F10, exec, $hub --wall
bind = $mainMod, T, exec, $rofi_theme
bind = $mainMod SHIFT, C, exec, $config

bind = ALT, V, exec, $hub --clip
bind = $mainMod, X, exec, $hub --power
bind = $mainMod SHIFT, D, exec, $hub --window

bind = $mainMod SHIFT, R, exec, hyprctl reload

###################
### APPS        ###
###################

bind = $mainMod, RETURN, exec, $hub --foot
bind = $mainMod SHIFT, RETURN, exec, $foot_float
bind = $mainMod, E, exec, $file
bind = $mainMod, W, exec, $browser
bind = $mainMod, F, fullscreen, 1

bind = $mainMod, Q, killactive
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, ESCAPE, exit
bind = $mainMod SHIFT, P, pseudo

###################
### SCREENSHOTS ###
###################

bind = , Print, exec, $shot --shotnow
bind = $mainMod, Print, exec, $shot --shotarea
bind = $mainMod, P, exec, $shot --shotarea

###################
### FOCUS       ###
###################

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

###################
### LAYOUT      ###
###################

bind = $mainMod, F5, exec, hyprctl dispatch togglefloating; hyprctl dispatch centerwindow
bind = $mainMod, F7, layoutmsg, togglesplit
bind = $mainMod, F8, exec, hyprctl dispatch togglefloating; hyprctl dispatch pin; hyprctl dispatch centerwindow

bind = ALT, TAB, swapnext,
bind = ALT SHIFT, TAB, swapnext, prev

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

###################
### WORKSPACES  ###
###################

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

###################
### MEDIA KEYS  ###
###################

bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPrev, exec, playerctl previous

bind = , F12, exec, $hub --waybar
