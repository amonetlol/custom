# theme-everforest — Hyprland (sem Matugen)

general {
    col.active_border = rgba(7fbbb3ee) rgba(d3c6aaee) 45deg
    col.inactive_border = rgba(2d353baa)
}

decoration {
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 0.92

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(1e2326ee)
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }
}

group {
    col.border_active = rgba(7fbbb3ee)
    col.border_inactive = rgba(2d353baa)
    col.border_locked_active = rgba(a7c080ee)
    col.border_locked_inactive = rgba(2d353baa)
}

# idle_inhibitor ativo ao iniciar: adicione ao hyprland.conf
# exec-once = ~/.config/custom/theme-everforest/rofi/hub.sh --idle-on
