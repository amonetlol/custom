# theme-orange — Hyprland (sem Matugen)

general {
    col.active_border = rgba(ff6600ee) rgba(df6124ee) 45deg
    col.inactive_border = rgba(111111aa)
}

decoration {
    rounding = 12

    active_opacity = 1.0
    inactive_opacity = 0.92

    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = rgba(000000cc)
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }
}

group {
    col.border_active = rgba(ff6600ee)
    col.border_inactive = rgba(111111aa)
    col.border_locked_active = rgba(df6124ee)
    col.border_locked_inactive = rgba(111111aa)
}

# idle_inhibitor ativo ao iniciar: adicione ao hyprland.conf
# exec-once = ~/.config/custom/theme-orange/rofi/hub.sh --idle-on
