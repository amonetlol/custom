# theme-edge — Hyprland (Edge Dark Aura Dim)

general {
    col.active_border = rgba(6cb6ebee) rgba(5dbbc1ee) 45deg
    col.inactive_border = rgba(2b2d37aa)
}

decoration {
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 0.92

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(202023cc)
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }
}

group {
    col.border_active = rgba(6cb6ebee)
    col.border_inactive = rgba(2b2d37aa)
    col.border_locked_active = rgba(5dbbc1ee)
    col.border_locked_inactive = rgba(2b2d37aa)
}

# idle_inhibitor ativo ao iniciar: adicione ao hyprland.conf
# exec-once = ~/.config/custom/theme-edge/rofi/hub.sh --idle-on
